<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&amp;display=swap');
      .text {
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 110px;
        font-weight: 600;
        letter-spacing: 0.04em;
        fill: #04140B;
      }
    </style>
  </defs>
  <!-- Background gradient -->
  <rect width="256" height="256" rx="64" fill="url(#grad)" />
  <!-- Inner shadow equivalent -->
  <rect x="4" y="4" width="248" height="248" rx="60" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8" />
  <!-- Outer stroke equivalent -->
  <rect width="256" height="256" rx="64" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="4" />
  
  <text x="50%" y="54%" class="text" text-anchor="middle" dominant-baseline="middle">MH</text>
</svg>
